<p-card>
  <div class="card-head">
    <h3>{{ def().title }}</h3>
    <p-tag
      [value]="badge.label"
      severity="warn"
      [pTooltip]="badge.tooltip"
      tooltipPosition="left"
    />
  </div>

  <details class="declare">
    <summary>What to declare</summary>
    <pre><code>{{ code() }}</code></pre>
  </details>

  <app-capability-demo [def]="def()" [hostUrl]="hostUrl()" />
</p-card>
