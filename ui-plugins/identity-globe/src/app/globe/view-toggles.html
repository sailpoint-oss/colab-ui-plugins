<div class="view-toggles" role="toolbar" aria-label="Globe display">
  @for (toggle of toggles; track toggle.key) {
    <button
      type="button"
      class="view-toggle"
      [class.view-toggle--on]="settings()[toggle.key]"
      [attr.aria-pressed]="settings()[toggle.key]"
      [disabled]="disabled(toggle.key)"
      (click)="onToggle(toggle.key)"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        @switch (toggle.icon) {
          @case ('rotate') {
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M20 12a8 8 0 1 1-2.2-5.5M20 4.5V9h-4.5"
            />
          }
          @case ('arcs') {
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              d="M4 16c4-9 12-9 16 0"
            />
            <circle cx="4" cy="16" r="1.7" fill="currentColor" />
            <circle cx="20" cy="16" r="1.7" fill="currentColor" />
          }
          @case ('clouds') {
            <path
              fill="currentColor"
              d="M7.2 18h9.4a3.6 3.6 0 0 0 .5-7.2 4.6 4.6 0 0 0-8.9-1.4A3.2 3.2 0 0 0 7.2 18z"
            />
          }
          @case ('dayNight') {
            <circle cx="12" cy="12" r="7.2" fill="none" stroke="currentColor" stroke-width="2" />
            <path fill="currentColor" d="M12 4.8a7.2 7.2 0 0 0 0 14.4z" />
          }
          @case ('moon') {
            <circle cx="12" cy="12" r="8" fill="currentColor" />
            <circle cx="9" cy="8" r="1.6" fill="#000" opacity="0.35" />
            <circle cx="15.5" cy="12.5" r="2.1" fill="#000" opacity="0.28" />
            <circle cx="10.5" cy="16" r="1.2" fill="#000" opacity="0.3" />
          }
        }
      </svg>
      <span class="view-toggle-label">{{ label(toggle) }}</span>
    </button>
  }
</div>
